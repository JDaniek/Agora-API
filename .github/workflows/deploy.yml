name: Deploy Backend Agora

on:
  push:
    branches: [ "jesel" ] # Se activa automáticamente al hacer push a main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Instalar Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Dar permisos de ejecución al gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Compilar el Proyecto (Crear el JAR)
      - name: Build with Gradle
        run: ./gradlew buildFatJar

      # 5. Subir el JAR al servidor (Usando SCP)
      - name: Copy JAR to AWS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "build/libs/agora-api-all.jar"
          target: "/tmp"
          strip_components: 2

      # 6. Conectarse por SSH y desplegar (MODO ESTRICTO)
      # Fíjate que ahora está alineado con los pasos anteriores
      - name: Execute Remote Deploy Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo ">>> [GITHUB] Iniciando despliegue ESTRICTO (Stop -> Replace -> Start)..."
            
            # 1. DETENER el servicio totalmente
            echo ">>> [GITHUB] Deteniendo el servicio..."
            sudo systemctl stop myapp.service
            
            # 2. BORRAR el archivo viejo para asegurar limpieza
            echo ">>> [GITHUB] Eliminando JAR anterior..."
            sudo rm -f /opt/apps/backend/app.jar
            
            # 3. MOVER el archivo nuevo a su lugar
            echo ">>> [GITHUB] Colocando nuevo JAR..."
            sudo mv /tmp/agora-api-all.jar /opt/apps/backend/app.jar
            
            # 4. Restaurar permisos (Siempre es bueno hacerlo)
            sudo chown git_deploy:deployers /opt/apps/backend/app.jar
            sudo chmod 770 /opt/apps/backend/app.jar
            
            # 5. INICIAR el servicio limpiamente
            echo ">>> [GITHUB] Iniciando el servicio..."
            sudo systemctl start myapp.service
            
            # 6. Verificación final
            echo ">>> [GITHUB] Verificando salud del sistema..."
            sleep 5
            if systemctl is-active --quiet myapp.service; then
                echo ">>> [EXITO] El sistema arrancó correctamente con el nuevo código."
            else
                echo ">>> [ERROR] El servicio no arrancó. Revisa los logs."
                exit 1
            fi